name: MovieDemo

options:
  bundleIdPrefix: com.glazedsolutions
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  Locator:
    path: MovieDemo/Locator
  Protocols:
    path: MovieDemo/Protocols
  Models:
    path: MovieDemo/Models
  APIClient:
    path: MovieDemo/APIClient
  AnalyticsClient:
    path: MovieDemo/AnalyticsClient
  MovieDetail:
    path: MovieDemo/MovieDetail
  MovieList:
    path: MovieDemo/MovieList
  MyMovies:
    path: MovieDemo/MyMovies
  MovieStore:
    path: MovieDemo/MovieStore
  MovieUI:
    path: MovieDemo/MovieUI

targets:
  MovieDemo:
    type: application
    platform: iOS
    sources:
      - path: MovieDemo
        excludes:
          - "Locator/**"
          - "Protocols/**"
          - "Models/**"
          - "APIClient/**"
          - "AnalyticsClient/**"
          - "MovieList/**"
          - "MovieDetail/**"
          - "MyMovies/**"
          - "MovieStore/**"
          - "MovieUI/**"
          - "**/.swiftpm/**"
          - "**/.build/**"
          - "Info.plist"
    dependencies:
      - package: Locator
      - package: Protocols
      - package: Models
      - package: APIClient
      - package: AnalyticsClient
      - package: MovieDetail
      - package: MovieList
      - package: MyMovies
      - package: MovieStore
      - package: MovieUI
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: MovieDemo/Info.plist
      properties:
        TMDBAPIKey: $(TMDB_API_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glazedsolutions.MovieDemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  MovieDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MovieDemoTests
    dependencies:
      - target: MovieDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glazedsolutions.MovieDemoTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MovieDemo:
    build:
      targets:
        MovieDemo: all
        MovieDemoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MovieDemoTests
        - package: Locator/LocatorTests
        - package: Protocols/ProtocolsTests
        - package: Models/ModelsTests
        - package: APIClient/APIClientTests
        - package: AnalyticsClient/AnalyticsClientTests
        - package: MovieDetail/MovieDetailTests
        - package: MovieList/MovieListTests
        - package: MyMovies/MyMoviesTests
        - package: MovieStore/MovieStoreTests
        - package: MovieUI/MovieUITests
